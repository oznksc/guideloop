name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: |
          npx tsc --noEmit -p packages/core/tsconfig.json
          npx tsc --noEmit -p packages/react/tsconfig.json
          npx tsc --noEmit -p packages/vanilla/tsconfig.json
          # Svelte / Angular compile via package build step below

      - name: Build
        run: npm run build

      - name: Verify release tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME}"
          CORE_V="v$(node -p 'require("./packages/core/package.json").version')"
          REACT_V="v$(node -p 'require("./packages/react/package.json").version')"
          VANILLA_V="v$(node -p 'require("./packages/vanilla/package.json").version')"
          SVELTE_V="v$(node -p 'require("./packages/svelte/package.json").version')"
          ANGULAR_V="v$(node -p 'require("./packages/angular/package.json").version')"
          test "$CORE_V" = "$TAG"
          test "$REACT_V" = "$TAG"
          test "$VANILLA_V" = "$TAG"
          test "$SVELTE_V" = "$TAG"
          test "$ANGULAR_V" = "$TAG"
          echo "Tag $TAG matches @guideloop/{core,react,vanilla,svelte,angular}"

      - name: Publish @guideloop/core
        run: npm publish -w @guideloop/core --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @guideloop/react
        run: npm publish -w @guideloop/react --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @guideloop/vanilla
        run: npm publish -w @guideloop/vanilla --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @guideloop/svelte
        run: npm publish -w @guideloop/svelte --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ng-packagr emits a self-contained package under dist/ (Ivy partial + fesm)
      - name: Publish @guideloop/angular
        run: npm publish ./packages/angular/dist --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
