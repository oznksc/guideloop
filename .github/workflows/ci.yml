name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit -p packages/core/tsconfig.json && npx tsc --noEmit -p packages/react/tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Audit
        run: npm audit --audit-level=high || true

      - name: Test with Coverage
        run: npm test

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.node-version }}
          path: coverage/

  e2e:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install demo dependencies
        run: npm ci
        working-directory: ./demo

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # Include browser set so chromium-only caches are not reused after multi-browser rollout
          key: playwright-${{ runner.os }}-cfw-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium firefox webkit

      - name: Install Playwright browsers
        # Always run: fills missing browsers even when an older cache hit only has chromium
        run: npx playwright install chromium firefox webkit

      - name: Build library
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test
