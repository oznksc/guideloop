<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@guideloop/vanilla — example</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      .card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        padding: 2rem;
        max-width: 420px;
        width: 100%;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: #475569;
        line-height: 1.5;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 0.65rem 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      #start-tour {
        background: #4f46e5;
        color: #fff;
      }
      #settings {
        background: #e2e8f0;
        color: #0f172a;
      }
      #feature {
        margin-top: 1.25rem;
        padding: 1rem;
        border-radius: 12px;
        background: #eef2ff;
        color: #312e81;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 id="welcome">@guideloop/vanilla</h1>
      <p>Imperative guided tour + Web Component demo. Build the monorepo first, then open this file via a static server that can resolve the package (or use the import map below after linking dist).</p>
      <div class="actions">
        <button id="start-tour" type="button">Start tour</button>
        <button id="settings" type="button">Settings</button>
      </div>
      <div id="feature">Multi-spotlight, themes, keyboard, and persist work without React.</div>
    </main>

    <!--
      For a quick local demo after `npm run build` at the repo root:
      npx serve examples/vanilla  (or any static server) won't resolve the monorepo package.
      Prefer importing from the built ESM entry via a relative path in this sandbox:
    -->
    <script type="module">
      import { GuideLoop } from '../../packages/vanilla/dist/esm/index.js';

      const tour = new GuideLoop({
        steps: [
          {
            target: '#welcome',
            title: 'Welcome',
            content: 'This is @guideloop/vanilla — no React required.',
            placement: 'bottom',
          },
          {
            target: '#settings',
            title: 'Settings',
            content: 'Highlight any CSS selector.',
            placement: 'bottom',
            spotlightShape: 'circle',
          },
          {
            target: '#feature',
            title: 'Features',
            content: 'Themes, keyboard nav, multi-target spotlights, and more.',
            placement: 'top',
            additionalTargets: ['#start-tour'],
          },
        ],
        theme: 'tailwind',
        keyboard: true,
        debug: false,
      });

      document.getElementById('start-tour').addEventListener('click', () => {
        void tour.start();
      });
    </script>
  </body>
</html>
